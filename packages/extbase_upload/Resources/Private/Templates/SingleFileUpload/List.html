<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        xmlns:gh="http://typo3.org/ns/Garvinhicking/ExtbaseUpload/Components"
        data-namespace-typo3-fluid="true"
>

<f:layout name="Default" />

<f:section name="main">

    <gh:hero
            title="TYPO3"
            link="https://typo3.org/"
    >
        Ich bin <strong>der Superhero!</strong>
    </gh:hero>

    <f:page.title>Kick me I like it</f:page.title>
    <f:page.title>Kick me I like it hard</f:page.title>
    <h1>Singlefile upload for FileReference!XX</h1>

    <ul>
        <f:for each="{items}" as="item">
            <li>
                {item.uid} <f:link.action action="edit" arguments="{item: item}">Edit</f:link.action>
            </li>
        </f:for>
    </ul>

    <p>
        <f:link.action action="new">New</f:link.action>
    </p>

</f:section>
