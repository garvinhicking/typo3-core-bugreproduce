<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">
    <ul>
    <f:for each="{persons}" as="person">
        <li>
            {person.firstName} {person.lastName} ({person.special})
            <f:link.action action="edit" arguments="{personUid: person.uid}">Edit</f:link.action>
        </li>
    </f:for>
    </ul>

    <f:link.action action="new">Create new</f:link.action>

    <f:link.action addQueryString="untrusted"
                   additionalParams="{'url':'https://git.uni-paderborn.de/api/v4/projects/3852/repository/files/METS_MODS%2Fmets_M0002.xml/raw'}">
        View ProductX
    </f:link.action>
</f:section>


</html>
